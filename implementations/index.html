<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/css/style.css">
        <link rel="stylesheet" href="/css/nav.css">
        <link rel="icon" href="/assets/favicon.ico">
        <title>SIMAS</title>
    </head>

    <body>
        <div id="navbar-placeholder">
            
        </div>

        <div id="stuffs">
            <main class="container">
                <div style="text-align: center;">
                    <h1 class="page-heading">SIMAS Implementations</h1>
                    <p style="font-size: 22px;">Take your pick from a wide array of SIMAS implementations, each with their own strengths (and weaknesses).</p>
                    <hr>
                </div>
                <div id="simas-implementations">

                </div>
            </main>
        </div>

        <footer id="footer-placeholder">

        </footer>

        <script src="/ecmascript/implementationLoader.js">
            (async () => {
                const implementations = await getImplementations();
                const element = document.getElementById(simas-implementations);
                if (implementations == undefined) {
                    const sorry = document.createElement("h2");
                    sorry.innerText = "Sooo... the list of SIMAS implementations failed to load. Sorry!";
                    element.appendChild(sorry);
                    return;
                }
                for (let i = 0; i < implementations.length; i++) element.appendChild(makeImplementation(implementations[i]));
            })();
        </script>
        <script src="/ecmascript/nav.js"></script>
        <script defer>
            fetch('/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
                awaken();
            });

            fetch('/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
        </script>
    </body>
</html>
